<!--
  Элемент 71 — «Текстовая кнопка с подчёркиванием». Источник — HyperUI, «Quiet text and underline buttons» (MIT).
  Две тихие кнопки без заливки: слово с подчёркиванием краской марки и слово без подчёркивания, под рукой — тон.
  Снято: индиго и сланец Tailwind, кольцо фокуса в 4 пикселя, пилюля вокруг слова.
  Приведено к единой форме: краски — роли палитры; подчёркивание — волосок края, под рукой — марка; кольцо набора.
-->

<body>
  <div class="live">
    <button class="el" data-voice="bare" data-underline type="button">View all products</button>
