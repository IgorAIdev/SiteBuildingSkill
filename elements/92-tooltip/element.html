<!--
  Элемент 92 — «Подсказка у слова». Источники — daisyUI «Tooltip», shadcn/ui «Tooltip», HyperUI «Tooltips» (MIT).
  Короткое пояснение появляется над словом, под ним, слева или справа — под рукой и на фокусе (клавиатура). Без скрипта:
  текст лежит в `data-tip`. Расширяет подсказку элемента 39.
-->
</head>
<body>
  <div class="live">
    <span class="tipped" tabindex="0" data-tip="Third-party lab report for every batch">Lab tested</span>
    <span class="tipped" tabindex="0" data-side="bottom" data-tip="Two to three working days">Fast delivery</span>
    <span class="tipped" tabindex="0" data-side="start" data-tip="Cool, dry, away from light">Storage</span>
    <span class="tipped" tabindex="0" data-side="end" data-tip="14 days, original package">Returns</span>
  </div>
</body>
