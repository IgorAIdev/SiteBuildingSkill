<!doctype html><meta charset="utf-8"><title>Test store regression</title>
<button id="run">Run test purchase checks</button><pre id="result">Not run</pre>
<iframe id="site" title="Test store"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('pre')
document.querySelector('button').onclick=async()=>{
  let checks=0;const failures=[]
  const assert=(ok,label)=>{checks++;if(!ok)failures.push(label)}
  const wait=ms=>new Promise(r=>setTimeout(r,ms))
  const ready=async(fn)=>{for(let i=0;i<100;i++){if(fn())return;await wait(30)}throw Error('Timed out waiting for test store')}
  const load=async(path)=>{await new Promise(r=>{frame.onload=r;frame.src=path});await ready(()=>frame.contentDocument.documentElement.dataset.testStore==='ready');return frame.contentDocument}
  try{
    for(const variant of ['original','minimal']){
      localStorage.removeItem('test-store-cart-v1')
      localStorage.removeItem('test-store-coupon-v1')
      let d=await load(`/${variant}/en/catalog/oil/`)
      d.querySelector('form:has(input[name="op"][value="add"])').requestSubmit()
      await ready(()=>d.querySelector('header a[aria-label="Your cart (1)"]'))
      assert(true,variant+' add')
      const cart=d.querySelector('[data-pane="end"][id^="cart-"]')
      await ready(()=>cart.querySelector('input[name="code"]'))
      assert(!cart.textContent.includes('Clear cart'),variant+' no bulk clear')
      cart.querySelector('summary').click()
      const code=cart.querySelector('input[name="code"]'),apply=cart.querySelector('button[value="coupon"]')
      code.value='invalid';apply.click()
      await ready(()=>cart.textContent.includes('Code not valid'))
      assert(!cart.textContent.includes('Test discount ·'),variant+' invalid coupon does not discount')
      code.value='TEST10';apply.click()
      await ready(()=>cart.textContent.includes('Test discount · TEST10'))
      assert(cart.textContent.includes('27.00'),variant+' coupon reduces total')
      cart.querySelector('button[value="uncoupon:TEST10"]').click()
      await ready(()=>!cart.textContent.includes('Test discount · TEST10'))
      assert(cart.textContent.includes('30.00'),variant+' removing coupon restores total')
      d=await load(`/${variant}/en/checkout/contact/`)
      await ready(()=>d.querySelector('main input[name="name"]'))
      assert(d.querySelector('header a[aria-label="Your cart (1)"]'),variant+' persist after navigation')
      for(const [key,value] of Object.entries({name:'Test Person',email:'test@example.com',address:'Test street',city:'Test City'}))d.querySelector(`main input[name="${key}"]`).value=value
      d.querySelector('main form').requestSubmit()
      await ready(()=>d.querySelector('main input[name="delivery"]'))
      d.querySelector('main form').requestSubmit()
      await ready(()=>d.querySelector('main input[name="payment"]'))
      d.querySelector('header a[aria-haspopup="dialog"][href$="/cart"]').click()
      const pane=d.querySelector('[data-pane="end"][id^="cart-"]')
      pane.querySelector('button[value^="set:"][data-up],button[value$=":2"]').click()
      await ready(()=>d.querySelector('main').textContent.includes('65.00'))
      assert(d.querySelector('main input[name="payment"]'),variant+' checkout step retained')
      assert(d.querySelector('main').textContent.includes('65.00'),variant+' checkout total synchronized')
      pane.hidePopover()
      d.querySelector('main input[type="checkbox"]').checked=true
      d.querySelector('main form').requestSubmit()
      await ready(()=>d.querySelector('main').textContent.includes('TEST-'))
      assert(d.querySelector('main').textContent.includes('65.00'),variant+' order total agrees')
      d.querySelector('header a[aria-haspopup="dialog"][href$="/cart"]').click()
      await ready(()=>pane.textContent.includes('Your cart is empty'))
      assert(!pane.querySelector('button[value^="remove:"]'),variant+' purchased lines removed')
    }
  }catch(e){failures.push(e.message)}
  out.textContent=JSON.stringify({checks,failures},null,2)
}
</script>
